# Single-package huntsman crate. Not a workspace.
# Warnings are lints that fail the build (clippy pedantic = deny).

[package]
name = "huntsman"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false
description = "Local RCVF session recorder for unprivileged Termux"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "deny"
